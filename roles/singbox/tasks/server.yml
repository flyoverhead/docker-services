---

# `-runtime` matters: naming this container after the service would collide with
# the running sing-box container and take the service down to run a one-shot
# `generate` command.
- name: config | generate server keys
  become: true
  community.docker.docker_container:
    name: '{{ singbox_docker_config.name }}-runtime'
    image: '{{ singbox_docker_config.image }}:{{ singbox_docker_config.tag }}'
    cleanup: true
    command: generate reality-keypair
    detach: false
  register: singbox_keys
  changed_when: true
  when:
    - not ansible_check_mode

- name: config | set server keys fact
  ansible.builtin.set_fact:
    singbox_private_key: >-
      {{ singbox_keys.container.Output | regex_search('(?<=PrivateKey: )(.*?)(?=\n)')
      if not ansible_check_mode
      else 'CHECK-MODE-PLACEHOLDER-PRIVATE-KEY' }}
    singbox_public_key: >-
      {{ singbox_keys.container.Output | regex_search('(?<=PublicKey: )(.*?)(?=\n)')
      if not ansible_check_mode
      else 'CHECK-MODE-PLACEHOLDER-PUBLIC-KEY' }}
  no_log: true
