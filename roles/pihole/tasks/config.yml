---

- name: config | check gravity database
  become: true
  ansible.builtin.stat:
    path: '{{ pihole_gravity_db }}'
  register: pihole_gravity_db_file

# The list tables are converged by comparing the row count in gravity.db with
# the number of entries in the *.list files: a mismatch means the files changed,
# so the handlers wipe and repopulate the table. Guarded on the database file
# because it is created by the container's first start, not by this role.
- name: config | pihole lists
  when:
    - pihole_gravity_db_file.stat.exists
  block:

    - name: config | check domain blacklist
      become: true
      ansible.builtin.command:
        cmd: sqlite3 {{ pihole_gravity_db }} "SELECT COUNT(*) FROM domainlist WHERE type='3'"
      register: pihole_domain_blacklist
      check_mode: false
      changed_when: pihole_domain_blacklist.stdout != pihole_lists.domain_blacklist
      notify:
        - pihole | clean domain blacklist
        - pihole | add domain blacklist
        - pihole | reload lists

    - name: config | check domain whitelist
      become: true
      ansible.builtin.command:
        cmd: sqlite3 {{ pihole_gravity_db }} "SELECT COUNT(*) FROM domainlist WHERE type='2'"
      register: pihole_domain_whitelist
      check_mode: false
      changed_when: pihole_domain_whitelist.stdout != pihole_lists.domain_whitelist
      notify:
        - pihole | clean domain whitelist
        - pihole | add domain whitelist
        - pihole | reload lists

    - name: config | check adlist
      become: true
      ansible.builtin.command:
        cmd: sqlite3 {{ pihole_gravity_db }} "SELECT COUNT(*) FROM adlist"
      register: pihole_adlist
      check_mode: false
      changed_when: pihole_adlist.stdout != pihole_lists.adlist
      notify:
        - pihole | add adlist
        - pihole | update gravity
