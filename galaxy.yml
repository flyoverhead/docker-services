---

namespace: flyoverhead
name: docker
version: 2.0.1
readme: README.md
authors:
  - flyoverhead
description: Ansible collection for docker services deployment
license:
  - GPL-3.0-only
tags:
  - dns
  - docker
  - linux
  - monitoring
  - networking
  - tools
  - vpn
dependencies:
  ansible.posix: '>=1.5.4'
  community.docker: '>=3.4.3'
  community.general: '>=8.0.0'

repository: https://github.com/flyoverhead/docker
issues: https://github.com/flyoverhead/docker/issues

# fnmatch patterns against the path relative to the collection root, so nested
# matches need a leading `*` -- a bare `.DS_Store` only ever matches the one at
# the top level
build_ignore:
  - '*.DS_Store'
  - .ansible
  - .ansible-lint
  - .claude
  - .pre-commit-config.yaml
  - .tflint.hcl
  - .vagrant
  - .venv
  - .vscode
  - .yamllint
  - Taskfile.yml
  - Vagrantfile
  - tests
